<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoMoney</title>
<meta name="theme-color" content="#1f4030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1d15;--win:#ece8d6;--edge:#7a9580;--ink:#1d2a1f;--t1:#3f7a52;--t2:#1f4030;--lcd:#b4c893;--lcdi:#22301a;--gold:#c9a227;--clay:#a4532f;--hov:#dfe8d0;--wine:#7b1e2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1d3a28,var(--bg) 70%) var(--bg);font:13px Tahoma,Verdana,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px 16px}
.win{width:100%;max-width:440px;align-self:flex-start;background:var(--win);border:1px solid #06120b;border-radius:8px 8px 3px 3px;box-shadow:0 12px 40px #000b;overflow:hidden}
.bar{background:linear-gradient(#6aa77a,var(--t1) 18%,var(--t2));color:#fff;font-weight:bold;font-size:14px;padding:7px 10px;text-shadow:1px 1px #0007;display:flex;align-items:center;gap:7px}
.bar i{width:12px;height:12px;background:var(--gold);border-radius:0 70%;transform:rotate(-10deg)}
.in{padding:10px}
.lcd{background:var(--lcd);color:var(--lcdi);font-family:VT323,monospace;border:2px inset #8a9a70;border-radius:4px;padding:6px 12px 10px;box-shadow:inset 0 0 14px #0003}
.top{display:flex;justify-content:space-between;align-items:center;font-size:24px}
.lcd button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0 4px}
.hero{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
#pet{width:54px;flex:none;shape-rendering:crispEdges;fill:var(--lcdi)}
#pet .w{fill:var(--wine)}
#say{font-size:20px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#cats .sal{padding-bottom:4px;margin-bottom:4px;border-bottom:1px dashed #22301a55}
.s0 #pet{animation:hop 1.4s steps(1) infinite}
.s1 #pet{animation:lk 2.4s steps(1) infinite}
.s2 #pet{animation:sh .5s steps(1) infinite}
@keyframes lk{33%{transform:translateX(-2px)}66%{transform:translateX(2px)}}
.s2 #say{color:var(--wine);animation:bl 1s steps(1) infinite}
@keyframes hop{50%{transform:translateY(-3px)}}
@keyframes sh{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#tot{font-size:clamp(40px,12vw,56px);line-height:1;margin-left:auto}
#cats{display:grid;grid-template-columns:80px 1fr auto;column-gap:8px}
#cats div{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;font-size:19px;line-height:1.2;cursor:pointer}
#cats span{overflow:hidden;white-space:nowrap}
.m{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:1px;height:10px}
.m i{background:#22301a26}
.m.nb i{background:none}
.m i.f{background:var(--lcdi)}
.m.over i.f{background:var(--wine)}
.m u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--lcdi);box-shadow:0 0 0 1px var(--lcd)}
.m.over+span{color:var(--wine)}
form{display:grid;grid-template-columns:1fr 1fr 70px;gap:6px;margin:10px 0}
input,select,button{font:inherit;color:var(--ink)}
input,select{border:1px solid var(--edge);background:#fff;padding:5px;min-width:0;border-radius:0}
#amt{grid-column:1/-1;font:30px VT323,monospace;text-align:right;padding:2px 8px}
#amt::-webkit-inner-spin-button{display:none}#amt{-moz-appearance:textfield}
#d{grid-column:2/4}
#note{grid-column:1/3}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:-1px}
button{background:linear-gradient(#fff,#e3dfcc);border:1px solid #3e5c45;border-radius:3px;padding:4px 10px;cursor:pointer}
button:hover{background:linear-gradient(#fff,#d6e2c4)}
button:active{background:#d6e2c4}
#add{font-weight:bold}
ul{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--edge);max-height:280px;overflow:auto}
li{display:grid;grid-template-columns:24px 82px 1fr auto 22px;gap:6px;align-items:center;padding:5px 6px;border-bottom:1px dotted #c9c4ad;cursor:pointer}
li:hover,li.ed{background:var(--hov)}
li span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
li span:first-child{color:#7a7560}
li button{border:0;background:none;color:var(--clay);font-size:15px;padding:0}
li.none{display:block;text-align:center;color:#9a9478;cursor:default}
footer{display:flex;gap:6px;margin-top:8px}
footer button{font-size:11px;padding:3px 8px}
#cur{margin-left:auto}
@media(max-width:600px){body{padding-top:max(16px,env(safe-area-inset-top))}input,select{font-size:16px}}
</style>
</head>
<body>
<div class="win">
  <div class="bar"><i></i>MoMoney</div>
  <div class="in">
    <div class="lcd">
      <div class="top"><button id="prev">&lt;</button><span id="mon"></span><button id="next">&gt;</button></div>
      <div class="hero"><svg id="pet" viewBox="0 0 12 9"></svg><span id="say"></span><div id="tot"></div></div>
      <div id="cats"></div>
    </div>
    <form id="f" autocomplete="off">
      <input id="amt" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required>
      <select id="cat"></select>
      <input id="d" type="date" required>
      <input id="note" placeholder="note">
      <button id="add">Add</button>
    </form>
    <ul id="list"></ul>
    <footer>
      <button id="bk">Backup</button><button id="rs">Restore</button><button id="csv">CSV</button><button id="cur"></button>
      <input id="file" type="file" accept=".json" hidden>
    </footer>
  </div>
</div>
<script>
const $=s=>document.querySelector(s),K='momoney',pad=n=>String(n).padStart(2,'0');
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{e:[],cur:'¤',c:['Food','Groceries','Home','Bills','Transport','Health','Shopping','Fun','Travel','Learning','Gifts','Other']};
let V=new Date(),edit=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const f=n=>n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const h=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const today=()=>{const t=new Date();return`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};

const PAL={1:'#22301a',2:'#7b1e2e',o:'#d9772b',w:'#f4ecd8',b:'#7a5230',t:'#c9a77a',y:'#e8b030',p:'#6b3fa0',q:'#45266b',s:'#f0d9b5',h:'#4a2d5e'};
const PET=[ // fox: happy, owl: cautious, witch: mad
 ['1..........1','11........11','1o1......1o1','1oo111111oo1','1oooooooooo1','1oo1oooo1oo1','1o1o1oo1o1o1','11wwooooww11','.1wwwoowww1.','..11wwww11..','....1ww1....','.....11.....'],
 ['.1........1.','.11......11.','.1b111111b1.','1bbbbbbbbbb1','1byyybbyyyb1','1by1ybby1yb1','1byyybbyyyb1','1btttyytttb1','.1tttttttt1.','.1tbttbttb1.','..11y11y11..'],
 ['.....qq.....','....1pp1....','...1pppp1...','..qqqyyqqq..','pppppppppppp','h1ssssssss1h','h11ssssss11h','h1s1ssss1s1h','h1s2ssss2s1h','h1ssssssss1h','h1sss11sss1h','h1ss1ss1ss1h','h1ssssssss1h','hh11111111hh','.pppqqqqppp.','pppppppppppp']];

function cats(sel){$('#cat').innerHTML=S.c.map(c=>`<option>${h(c)}</option>`).join('')+'<option value="+">+ new</option>';if(sel)$('#cat').value=sel}

function R(){
  const ym=`${V.getFullYear()}-${pad(V.getMonth()+1)}`;
  $('#mon').textContent=V.toLocaleString('en',{month:'short',year:'numeric'}).toUpperCase();
  const L=S.e.filter(x=>x.d.startsWith(ym)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  const t=L.reduce((s,x)=>s+x.a,0);
  $('#tot').textContent=f(t);
  S.b=S.b||{};
  const now=new Date(),dv=V.getFullYear()*12+V.getMonth(),dn=now.getFullYear()*12+now.getMonth();
  const p=dv<dn?1:dv>dn?0:now.getDate()/new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  // 12 cells = budget, tick = how far into the month; 1 = ahead of pace, 2 = past budget
  const tk=p>0&&p<1?`<u style="left:${p*100}%"></u>`:'';
  const lvl=r=>r>1?2:r>=.5&&r>p+.1?1:0;
  const bar=(r,cls,tick)=>{const n=Math.max(r?1:0,Math.round(Math.min(r,1)*12));return`<span class="m${cls}">${'<i class="f"></i>'.repeat(n)+'<i></i>'.repeat(12-n)}${tick}</span>`};
  const by={};L.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  Object.keys(S.b).forEach(c=>by[c]=by[c]||0);
  const T=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...T.map(t=>t[1]));
  let ws=S.s?lvl(t/S.s):0,worst=ws?(ws>1?'!':'~'):'';
  $('#cats').innerHTML=(S.s?`<div data-s class="sal"><span>Left</span>${bar(t/S.s,ws>1?' over':'',ws>1?'':tk)}<span>${f(S.s-t)}</span></div>`:`<div data-s class="sal"><span>Salary</span>${bar(0,'','')}<span>—</span></div>`)+T.map(([c,v])=>{
    const b=S.b[c],r=b?v/b:v/mx,l=b?lvl(r):0;
    if(l>ws){ws=l;worst=c+(l>1?' !':' ~')}
    return `<div data-c="${h(c)}"><span>${h(c)}</span>${bar(r,(b?'':' nb')+(l>1?' over':''),b&&l<2?tk:'')}<span>${f(v)}</span></div>`;
  }).join('');
  $('#pet').setAttribute('viewBox',`0 0 12 ${PET[ws].length}`);
  $('#pet').style.height=PET[ws].length*4.5+'px';
  $('#pet').innerHTML=PET[ws].flatMap((row,y)=>[...row].map((ch,x)=>ch==='.'?'':`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[ch]}"/>`)).join('');
  $('.lcd').className='lcd s'+ws;
  $('#say').textContent=worst;
  $('#list').innerHTML=L.map(x=>`<li data-id="${x.id}"${x.id===edit?' class="ed"':''}><span>${x.d.slice(8)}</span><span>${h(x.c)}</span><span>${h(x.n)}</span><b>${f(x.a)}</b><button data-del>×</button></li>`).join('')||'<li class="none">—</li>';
  $('#cur').textContent=S.cur;
  $('#add').textContent=edit?'Save':'Add';
}

function reset(){edit=null;$('#f').reset();$('#d').value=today();cats(S.c[0]);R();$('#amt').focus()}

$('#f').onsubmit=e=>{
  e.preventDefault();
  const x={id:edit||Date.now(),a:+$('#amt').value,c:$('#cat').value,n:$('#note').value.trim(),d:$('#d').value};
  if(!x.a||x.c==='+')return;
  S.e=S.e.filter(y=>y.id!==x.id);S.e.push(x);save();
  V=new Date(x.d+'T12:00');reset();
};
$('#cat').onchange=()=>{
  if($('#cat').value!=='+')return;
  const n=(prompt('Category')||'').trim();
  if(n&&!S.c.includes(n)){S.c.push(n);save()}
  cats(n||S.c[0]);
};
$('#list').onclick=e=>{
  const li=e.target.closest('li[data-id]');if(!li)return;
  const id=+li.dataset.id,x=S.e.find(y=>y.id===id);
  if(e.target.hasAttribute('data-del')){if(confirm('Delete?')){S.e=S.e.filter(y=>y.id!==id);save();if(edit===id)reset();else R()}return}
  if(edit===id)return reset();
  edit=id;$('#amt').value=x.a;cats(x.c);$('#d').value=x.d;$('#note').value=x.n;R();$('#amt').focus();
};
$('#cats').onclick=e=>{
  const d=e.target.closest('[data-c],[data-s]');if(!d)return;
  if(d.hasAttribute('data-s')){const v=prompt('Monthly salary',S.s||'');if(v!==null){S.s=+v>0?+v:0;save();R()}return}
  const c=d.dataset.c,v=prompt(c+' budget',S.b[c]||'');if(v===null)return;
  if(+v>0)S.b[c]=+v;else delete S.b[c];save();R();
};
document.onkeydown=e=>{if(e.key==='Escape'&&edit)reset()};
$('#prev').onclick=()=>{V.setDate(1);V.setMonth(V.getMonth()-1);R()};
$('#next').onclick=()=>{V.setDate(1);V.setMonth(V.getMonth()+1);R()};
$('#cur').onclick=()=>{const c=prompt('Currency',S.cur);if(c){S.cur=c.trim();save();R()}};
$('#bk').onclick=()=>dl(`momoney-${today()}.json`,JSON.stringify(S),'application/json');
$('#csv').onclick=()=>dl(`momoney-${today()}.csv`,'date,category,note,amount\n'+S.e.map(x=>[x.d,x.c,x.n,x.a].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
$('#rs').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  try{const d=JSON.parse(await e.target.files[0].text());if(Array.isArray(d.e)&&confirm('Replace all data?')){S=d;save();reset()}}catch(err){alert('Invalid file')}
  e.target.value='';
};
reset();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
</html>
